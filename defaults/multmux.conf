# multmux configuration - sourced by multmux, do not execute directly
# See: https://github.com/DenisDupeyron/multmux

# The initial directory for each pane or session
START_DIR="${HOME}"

# Main pane width (columns or percentage)
MAIN_PANE_WIDTH="60%"

# Number of overflow panes stacked vertically on the right side
OVERFLOW_PANES=3

# Number of inner sessions at start in the main pane (maximum 99)
INNER_SESSIONS=10

# Base tmux config applied to both outer and inner sessions
BASE_CONF=$(cat << 'EOF'
EOF
)

# Additional config for the outer session only
OUTER_CONF=$(cat << 'EOF'
set -g status off
EOF
)

# Additional config for the inner sessions only
INNER_CONF=$(cat << 'EOF'
set -g status-left "#S"
set -g status-right ""
set -g window-status-format ""
set -g window-status-current-format ""
set -g status-left-length 80
set -g status on
EOF
)
